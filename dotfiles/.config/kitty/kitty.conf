# ============================================================
# FONT
# ============================================================

font_family      SF Mono
bold_font        auto
italic_font      auto
bold_italic_font auto

font_size 10.0

# Use Hack Nerd Font only for Powerline and application icons.
symbol_map U+E000-U+F8FF,U+F0000-U+FFFFD,U+100000-U+10FFFD Hack Nerd Font Mono

# Keep programming ligatures, but separate them under the cursor.
disable_ligatures cursor


# ============================================================
# WINDOW
# ============================================================

window_padding_width 12

background_opacity 1.0
background_blur 32

hide_window_decorations yes

# Automatically reload this file after saving.
auto_reload_config 0.5


# ============================================================
# CURSOR
# ============================================================

cursor_shape block
cursor_blink_interval 0.6 ease-in-out
cursor_stop_blinking_after 15


# ============================================================
# SCROLLBACK
# ============================================================

scrollback_lines 10000

wheel_scroll_multiplier 3.0
touch_scroll_multiplier 1.0


# ============================================================
# SELECTION AND CLIPBOARD
# ============================================================

copy_on_select yes
strip_trailing_spaces smart

map ctrl+v paste_from_clipboard
map ctrl+shift+m launch --type=overlay unimatrix -c cyan -a

# ============================================================
# SHELL INTEGRATION
# ============================================================

shell_integration enabled
editor micro


# ============================================================
# WINDOW AND TAB SHORTCUTS
# ============================================================

# Open a new Hyprland window in the current directory.
map ctrl+shift+n new_os_window_with_cwd

# Open a new Kitty tab in the current directory.
map ctrl+t new_tab_with_cwd

# Font sizing.
map ctrl+equal change_font_size all +1.0
map ctrl+plus  change_font_size all +1.0
map ctrl+minus change_font_size all -1.0
map ctrl+0     change_font_size all 0

# Useful scrollback tools.
map ctrl+shift+f show_scrollback
map ctrl+shift+/ search_scrollback
map ctrl+shift+g show_last_command_output


# ============================================================
# BELL
# ============================================================

enable_audio_bell no
visual_bell_duration 0.0
window_alert_on_bell no


# ============================================================
# DANKMATERIALSHELL-GENERATED FILES
# ============================================================

# DMS owns these files and regenerates their colors.
include dank-tabs.conf
include dank-theme.conf
